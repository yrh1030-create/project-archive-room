<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--line:#e3e6eb;--text:#1f2329;--muted:#6b7280;--accent:#2563eb;--accent-bg:#eaf1ff;--hover:#f2f4f7}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;color:var(--text);background:var(--bg);font-size:14px}
.app{display:grid;grid-template-columns:380px 1fr;height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.head{padding:14px 14px 10px;border-bottom:1px solid var(--line)}
.head h1{font-size:16px;margin:0 0 4px}
.head .sub{color:var(--muted);font-size:12px;margin-bottom:10px}
input[type=search]{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;font-size:14px;outline:none}
input[type=search]:focus{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:2px 10px;font-size:12px;cursor:pointer;color:var(--muted)}
.chip.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
.list{overflow:auto;flex:1}
.grp{position:sticky;top:0;background:#fafbfc;border-bottom:1px solid var(--line);padding:6px 14px;font-size:12px;font-weight:600;color:var(--muted);z-index:1}
.item{padding:9px 14px;border-bottom:1px solid #f0f1f3;cursor:pointer;display:flex;gap:10px}
.item:hover{background:var(--hover)}
.item.on{background:var(--accent-bg)}
.no{flex:none;min-width:34px;font-variant-numeric:tabular-nums;color:var(--accent);font-weight:600;font-size:12px;padding-top:2px}
.t{font-size:13px;line-height:1.4}
.m{font-size:12px;color:var(--muted);margin-top:2px}
.tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:4px;margin-left:4px;background:#fff4e5;color:#b45309}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
.info{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;font-size:13px}
.info h2{font-size:15px;margin:0 0 4px}
.info table{border-collapse:collapse;width:100%;margin-top:6px;font-size:12px}
.info td,.info th{border:1px solid var(--line);padding:3px 6px;text-align:left;vertical-align:top}
.info th{background:#fafbfc;font-weight:600;white-space:nowrap}
.info .acts{float:right}
.info a{color:var(--accent);text-decoration:none;margin-left:10px}
iframe{flex:1;border:0;width:100%;background:#525659}
.empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--muted)}
@media (max-width:800px){.app{grid-template-columns:1fr;grid-template-rows:45vh 1fr}aside{border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="head">
      <h1>__TITLE__</h1>
      <div class="sub" id="sum"></div>
      <input type="search" id="q" placeholder="搜索合同名称、签订方、序号…">
      <div class="chips" id="chips"></div>
    </div>
    <div class="list" id="list"></div>
  </aside>
  <main>
    <div class="info" id="info" hidden></div>
    <div class="empty" id="empty">← 点击左侧合同即可预览</div>
    <iframe id="pdf" hidden></iframe>
  </main>
</div>
<script>
const DOCS = __DOCS__;
const $ = id => document.getElementById(id);
const kinds = ["全部", ...new Set(DOCS.map(d => d.kind))];
let kind = "全部", cur = null;
$("sum").textContent = `共 ${DOCS.length} 个 PDF，对应台账 ${DOCS.reduce((a,d)=>a+d.nos.length,0)} 条（重复文件只保留一份）`;
$("chips").innerHTML = kinds.map(k => `<span class="chip${k===kind?' on':''}" data-k="${k}">${k}</span>`).join("");
$("chips").onclick = e => { const k = e.target.dataset.k; if (!k) return; kind = k;
  [...$("chips").children].forEach(c => c.classList.toggle("on", c.dataset.k === k)); render(); };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const label = nos => nos.length > 3 ? `${nos[0]}…${nos[nos.length-1]}` : nos.join(",");
function render(){
  const q = $("q").value.trim().toLowerCase();
  const hit = DOCS.map((d,i)=>({d,i})).filter(({d}) =>
    (kind === "全部" || d.kind === kind) &&
    (!q || (d.title + d.nos.join(" ") + d.rows.map(r => r.name + r.party).join(" ")).toLowerCase().includes(q)));
  let html = "", g = null;
  for (const {d,i} of hit) {
    if (d.project !== g) { g = d.project; html += `<div class="grp">${esc(g)}</div>`; }
    const sub = d.title.startsWith(d.project + "—") ? d.title.slice(d.project.length + 1) : d.title;
    const parties = [...new Set(d.rows.map(r => r.party))].join("、");
    html += `<div class="item${i===cur?' on':''}" data-i="${i}"><div class="no">${label(d.nos)}</div><div>
      <div class="t">${esc(sub)}${d.kind!=="合同"?`<span class="tag">${esc(d.kind)}</span>`:""}</div>
      <div class="m">${esc(parties)}</div></div></div>`;
  }
  $("list").innerHTML = html || `<div class="empty" style="padding:30px">没有匹配的合同</div>`;
}
$("list").onclick = e => { const it = e.target.closest(".item"); if (it) open(+it.dataset.i); };
$("q").oninput = render;
function open(i){
  cur = i; const d = DOCS[i];
  $("empty").hidden = true; $("pdf").hidden = false; $("info").hidden = false;
  // 打开时整页适应窗口（一屏刚好一页），之后可用 PDF 工具栏自行缩放
  const url = encodeURI(d.file) + "#view=Fit&zoom=page-fit&pagemode=none";
  const fr = $("pdf"), next = fr.cloneNode();
  next.hidden = false; next.src = url; fr.replaceWith(next);
  $("info").innerHTML = `<span class="acts"><a href="${url}" target="_blank">新窗口打开</a></span>
    <h2>${esc(d.title)}</h2>
    <div class="m">${esc(d.kind)} · ${d.pages} 页 · ${(d.size/1048576).toFixed(1)} MB${d.removed?` · 已去除：${esc(d.removed)}`:""} · 原文件：${d.sources.map(esc).join("；")}</div>
    <table><tr><th>序号</th><th>合同名称</th><th>签订方</th><th>签订时间</th><th>合同金额</th></tr>
    ${d.rows.map(r=>`<tr><td>${r.no}</td><td>${esc(r.name)}</td><td>${esc(r.party)}</td><td>${esc(r.date)}</td><td>${esc(r.amount)}</td></tr>`).join("")}</table>`;
  [...document.querySelectorAll(".item")].forEach(el => el.classList.toggle("on", +el.dataset.i === i));
}
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || cur === null) return;
  const items = [...document.querySelectorAll(".item")].map(el => +el.dataset.i);
  const p = items.indexOf(cur);
  if (e.key === "ArrowDown" && p < items.length-1) { open(items[p+1]); e.preventDefault(); }
  if (e.key === "ArrowUp" && p > 0) { open(items[p-1]); e.preventDefault(); }
  document.querySelector(".item.on")?.scrollIntoView({block:"nearest"});
});
render();
</script>
</body>
</html>
